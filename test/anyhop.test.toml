[server]
listen = "127.0.0.1:18080"
max_retries = 4
attempt_timeout_secs = 10
state_file = ""
api_key = "test-gw-key"

[[providers]]
name = "mock"
type = "openai_compat"
base_url = "http://127.0.0.1:9100/v1"
strategy = "round_robin"
keys = ["good-key-1", "bad-429", "bad-401", "good-key-2"]
models = ["test-model"]

[[providers]]
name = "gemini"
type = "gemini"
base_url = "http://127.0.0.1:9101/v1beta"
strategy = "fill_first"
keys = ["gkey-bad", "gkey-good"]
models = ["test-gemini"]

[[providers]]
name = "ag"
type = "antigravity"
base_url = "http://127.0.0.1:9102"
strategy = "fill_first"
# models intentionally empty — the list is pulled via fetchAvailableModels

[[providers.accounts]]
email = "bad@test.dev"
access_token = "ag-bad"
project_id = "test-project"

[[providers.accounts]]
email = "good@test.dev"
access_token = "ag-good"
project_id = "test-project"

[[providers]]
name = "drainmock"
type = "openai_compat"
base_url = "http://127.0.0.1:9100/v1"
strategy = "fill_first"
drain_below_pct = 10
keys = ["drain-key"]
models = ["drain-model"]

[[providers]]
name = "err500"
type = "openai_compat"
base_url = "http://127.0.0.1:9100/v1"
strategy = "fill_first"
keys = ["bad-500"]
models = ["err-model"]

[[combos]]
name = "testcombo"
chain = ["gemini/test-gemini", "mock/test-model"]

[[providers]]
name = "claude"
type = "anthropic"
base_url = "http://127.0.0.1:9103"
strategy = "fill_first"
keys = ["cl-bad", "cl-good"]
models = ["claude-test"]

[[providers]]
name = "codex"
type = "codex"
base_url = "http://127.0.0.1:9104"
strategy = "fill_first"
models = ["gpt-codex-test"]

[[providers.accounts]]
email = "cx-bad@test.dev"
access_token = "cx-bad"
account_id = "acc-bad"

[[providers.accounts]]
email = "cx-good@test.dev"
access_token = "cx-good"
account_id = "acc-123"
