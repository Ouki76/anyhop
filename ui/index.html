<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>anyhop</title>
<script>
// Применяем тему до первого рендера — без вспышки
(function(){var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;})();
</script>
<style>
:root {
  --bg: #FFF8F1;
  --panel: #FFFDFB;
  --border: #EDE3D6;
  --fg: #1E1B16;
  --dim: #9A8F7E;
  --c1: #FFAF01; --c2: #FF8204; --c3: #FA500F; --c4: #E61300; --c5: #C4001D;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", monospace;
  --green-bg: #EAF6EF; --green-fg: #2F9E63;
  --yellow-bg: #FBF2DF; --yellow-fg: #B7791F;
  --red-bg: #FAEBEB; --red-fg: #D64545;
  --accent-soft: #FFF0E5;
}
[data-theme="dark"] {
  --bg: #16120D;
  --panel: #1F1A14;
  --border: #352D22;
  --fg: #F0EAE0;
  --dim: #8D8271;
  --green-bg: rgba(47,158,99,.14); --green-fg: #4CC38A;
  --yellow-bg: rgba(255,175,1,.12); --yellow-fg: #FFAF01;
  --red-bg: rgba(230,19,0,.12); --red-fg: #FF6B5E;
  --accent-soft: rgba(250,80,15,.14);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { min-height: 100%; background: var(--bg); }
body {
  min-height: 100vh;
  background: var(--bg); color: var(--fg);
  font: 15px/1.6 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* градиентная полоса сверху — фирменный пиксель-градиент */
.topbar {
  height: 4px;
  background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3), var(--c4), var(--c5));
}

.wrap { max-width: 1100px; margin: 0 auto; padding: 0 32px 96px; }

/* header */
.top {
  display: flex; align-items: center; gap: 16px;
  padding: 36px 0 28px;
  border-bottom: 1px solid var(--border);
}
.logo { display: flex; align-items: center; gap: 12px; }
.logo-mark { display: grid; grid-template-columns: repeat(2, 7px); grid-auto-rows: 7px; gap: 1.5px; }
.logo-mark i { display: block; }
.logo-mark i:nth-child(1) { background: var(--c1); }
.logo-mark i:nth-child(2) { background: var(--c2); }
.logo-mark i:nth-child(3) { background: var(--c3); }
.logo-mark i:nth-child(4) { background: var(--c5); }
.logo-text { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }
.tagline {
  font-family: var(--mono); font-size: 11px; text-transform: uppercase;
  letter-spacing: 0.14em; color: var(--dim); margin-top: 2px;
}
.status-pill {
  margin-left: auto; display: flex; align-items: center; gap: 10px;
  font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--dim);
  background: var(--panel); border: 1px solid var(--border);
  padding: 9px 18px; border-radius: 6px;
}
.pulse { width: 7px; height: 7px; background: var(--green-fg); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }

/* tabs — mono uppercase, линия снизу */
.tabs {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 44px;
}
.tab {
  padding: 14px 22px; cursor: pointer;
  font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--dim); background: none; border: none;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color .15s;
}
.tab:hover { color: var(--fg); }
.tab.active { color: var(--fg); border-bottom-color: var(--c3); }

/* theme toggle */
.top .theme-btn { margin-left: auto; }
.theme-btn {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--dim); background: var(--panel); border: 1px solid var(--border);
  padding: 9px 16px; border-radius: 6px; cursor: pointer; transition: all .15s;
}
.theme-btn:hover { border-color: var(--dim); color: var(--fg); }
.theme-btn .sq { width: 8px; height: 8px; }
[data-theme="dark"] .sq { background: var(--c1); }
.sq { background: var(--fg); }

/* stat cards — divided grid */
.stats {
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  overflow: hidden; margin-bottom: 48px;
}
.stat { padding: 26px 28px; }
.stat + .stat { border-left: 1px solid var(--border); }
.stat .num { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
.stat .lbl {
  font-family: var(--mono); font-size: 10.5px; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--dim); margin-top: 6px;
}
.stat { position: relative; }
.stat::before {
  content: ""; position: absolute; top: 0; left: 0;
  width: 24px; height: 3px;
  background: linear-gradient(90deg, var(--c1), var(--c3));
  opacity: 0; transition: opacity .2s ease;
}
.stat:hover::before { opacity: 1; }

/* section headers */
.section-title {
  font-family: var(--mono); font-size: 11px; text-transform: uppercase;
  letter-spacing: 0.14em; color: var(--dim);
  margin-bottom: 14px; display: flex; align-items: center; gap: 10px;
}
.section-title::before { content: ""; width: 8px; height: 8px; background: var(--c3); }

/* cards */
.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; margin-bottom: 20px; overflow: hidden;
  transition: border-color .2s ease;
}
.card:hover { border-color: var(--dim); }

/* появление контента вкладок */
@keyframes tabin { from { opacity: 0; } to { opacity: 1; } }
.tab-content { animation: tabin .12s ease-out; }

/* статус-точка провайдера в заголовке карточки */
.pdot { width: 8px; height: 8px; flex-shrink: 0; }
.pdot-ok { background: var(--green-fg); }
.pdot-warn { background: var(--yellow-fg); }
.pdot-err { background: var(--red-fg); }

/* hover по строкам таблиц */
tbody tr, table tr td { transition: background .12s ease; }
table tr:hover td { background: var(--bg); }

/* footer */
.footer {
  margin-top: 64px; padding-top: 20px; border-top: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--mono); font-size: 10.5px; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--dim);
}
.footer .pix { display: flex; gap: 2px; }
.footer .pix i { width: 5px; height: 5px; display: block; }
.footer .pix i:nth-child(1) { background: var(--c1); }
.footer .pix i:nth-child(2) { background: var(--c2); }
.footer .pix i:nth-child(3) { background: var(--c3); }
.footer .pix i:nth-child(4) { background: var(--c4); }
.footer .pix i:nth-child(5) { background: var(--c5); }
.card-head {
  display: flex; gap: 10px; align-items: center;
  padding: 18px 24px; border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.card-head b { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
.badge {
  font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em;
  padding: 4px 10px; border-radius: 5px;
  background: var(--bg); color: var(--dim); border: 1px solid var(--border);
}
.badge.accent { background: var(--accent-soft); color: var(--c3); border-color: transparent; }
.badge.raw { text-transform: none; letter-spacing: 0.02em; font-size: 11.5px; }

/* tables */
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 12px 24px; font-size: 13.5px; }
th {
  font-family: var(--mono); font-size: 10.5px; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--dim); font-weight: 500;
  border-bottom: 1px solid var(--border); background: var(--bg);
  white-space: nowrap;
}
tr + tr td { border-top: 1px solid var(--border); }
td.mono { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
td.num { font-variant-numeric: tabular-nums; }

/* chips — квадратные, mono, uppercase */
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--mono); font-size: 10.5px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.08em;
  padding: 4px 10px; border-radius: 5px;
}
.chip::before { content: ""; width: 6px; height: 6px; background: currentColor; }
.chip-active   { color: var(--green-fg); background: var(--green-bg); }
.chip-cooldown { color: var(--yellow-fg); background: var(--yellow-bg); }
.chip-dead     { color: var(--red-fg); background: var(--red-bg); }

/* buttons/inputs */
.btn {
  background: var(--panel); color: var(--fg); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 14px;
  font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  cursor: pointer; transition: all .15s;
}
.btn:hover { border-color: var(--dim); }
.btn-danger { color: var(--red-fg); }
.btn-primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn-primary:hover { opacity: 0.85; }
.input {
  background: var(--panel); color: var(--fg); border: 1px solid var(--border);
  border-radius: 6px; padding: 8px 14px; font-size: 13px; flex: 1;
  font-family: var(--mono); transition: border-color .15s;
}
.input:focus { outline: none; border-color: var(--c3); }
.addkey { display: flex; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--border); }

/* config editor */
.config-editor {
  width: 100%; min-height: 480px; border: none; resize: vertical;
  background: var(--panel); color: var(--fg);
  font-family: var(--mono); font-size: 12.5px; line-height: 1.6;
  padding: 20px 24px; tab-size: 2;
}
.config-editor:focus { outline: none; }
.config-actions {
  display: flex; gap: 10px; align-items: center;
  padding: 14px 24px; border-top: 1px solid var(--border);
}
.config-status { font-family: var(--mono); font-size: 11.5px; color: var(--dim); }

/* oauth banner */
.auth-banner {
  margin: 0 24px 16px; padding: 12px 16px; border-radius: 6px;
  font-family: var(--mono); font-size: 12px; word-break: break-all;
}
.auth-waiting { background: var(--yellow-bg); color: var(--yellow-fg); }
.auth-done { background: var(--green-bg); color: var(--green-fg); }
.auth-error { background: var(--red-bg); color: var(--red-fg); }

/* quotas — компактная сетка карточек аккаунтов */
.quota-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
  align-items: start; /* иначе свёрнутые карточки растягиваются до высоты открытых */
}
.quota-card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 16px 20px;
  transition: border-color .2s ease;
}
.quota-card:hover { border-color: var(--dim); }
.quota-card-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 12px; padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
  min-width: 0;
}
.quota-card-head .badge {
  min-width: 0; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; flex-shrink: 1;
}
.quota-worst, .quota-caret { flex-shrink: 0; }
.quota-card-head b { font-size: 14px; font-weight: 600; }
.quota-card-head .badge { font-size: 10px; }
.quota-row {
  display: flex; align-items: center; gap: 10px;
  padding: 5px 0; font-size: 12.5px;
}
.quota-name {
  font-family: var(--mono); font-size: 11.5px; flex: 1;
  min-width: 0; /* иначе flex-элемент не сжимается и вылезает за край */
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.quota-bar {
  display: inline-block; width: 90px; height: 5px; flex-shrink: 0;
  background: var(--bg); border-radius: 100px; overflow: hidden;
}
.quota-bar.empty { visibility: hidden; }
.quota-fill { height: 100%; background: linear-gradient(90deg, var(--c1), var(--c3)); border-radius: 100px; transition: width .6s ease; }
.quota-fill.low { background: var(--red-fg); }
.quota-pct {
  font-family: var(--mono); font-size: 11px; color: var(--dim);
  width: 36px; text-align: right; flex-shrink: 0;
}
.quota-reset {
  font-family: var(--mono); font-size: 10px; color: var(--dim);
  width: 82px; flex-shrink: 0;
}
/* сворачиваемые карточки */
.quota-card-head { cursor: pointer; user-select: none; margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
.quota-card-head:hover b { color: var(--c3); }
.quota-card.open .quota-card-head {
  margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
}
.quota-card .quota-body { display: none; }
.quota-card.open .quota-body { display: block; }
.quota-caret { font-family: var(--mono); font-size: 10px; color: var(--dim); }
.quota-worst { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-left: auto; white-space: nowrap; }
.quota-worst.low { color: var(--red-fg); }
.quota-card.open .quota-worst { display: none; }

/* events */
.events { display: flex; flex-direction: column; }
.ev {
  display: flex; gap: 14px; align-items: baseline;
  padding: 13px 24px; border-bottom: 1px solid var(--border);
  font-size: 13.5px;
}
.ev:last-child { border-bottom: none; }
.ev-ts { color: var(--dim); font-family: var(--mono); font-size: 11.5px; flex-shrink: 0; }
.ev-kind {
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.08em;
  padding: 3px 8px; border-radius: 4px; flex-shrink: 0;
}
.ev-rate_limited { color: var(--yellow-fg); background: var(--yellow-bg); }
.ev-dead { color: var(--red-fg); background: var(--red-bg); }
.ev-backoff, .ev-drain { color: var(--dim); background: var(--bg); }
.ev-detail { color: var(--dim); }

.empty {
  color: var(--dim); padding: 48px 24px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.empty .pix { display: grid; grid-template-columns: repeat(3, 8px); grid-auto-rows: 8px; gap: 2px; opacity: .55; }
.empty .pix i { display: block; background: var(--border); }
.empty .pix i:nth-child(2) { background: var(--c3); }
.empty .pix i:nth-child(5) { background: var(--c2); }
.loading { color: var(--dim); padding: 96px 0; text-align: center; font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; }

/* ---------- адаптив ---------- */

/* горизонтальный скролл таблиц на узких экранах */
.table-scroll { overflow-x: auto; }
.table-scroll table { min-width: 720px; }

/* планшеты */
@media (max-width: 960px) {
  .wrap { padding: 0 20px 64px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .stat:nth-child(3) { border-left: none; }
  .stat:nth-child(n+3) { border-top: 1px solid var(--border); }
  .quota-grid { grid-template-columns: 1fr 1fr; }
}

/* телефоны */
@media (max-width: 640px) {
  .quota-bar { width: 60px; }
  .quota-reset { width: 70px; }
  .quota-row { gap: 8px; }
  .wrap { padding: 0 14px 48px; }
  .top { flex-wrap: wrap; gap: 12px; padding: 24px 0 18px; }
  .logo-text { font-size: 19px; }
  .tabs { overflow-x: auto; margin-bottom: 28px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 12px 14px; font-size: 11px; flex-shrink: 0; }
  .stats { grid-template-columns: 1fr 1fr; }
  .stat { padding: 18px 18px; }
  .stat .num { font-size: 26px; }
  .quota-grid { grid-template-columns: 1fr; }
  .card-head { padding: 14px 16px; }
  th, td { padding: 10px 14px; }
  .addkey { padding: 12px 16px; flex-wrap: wrap; }
  .config-editor { min-height: 320px; font-size: 11.5px; padding: 14px 16px; }
  .ev { padding: 10px 14px; flex-wrap: wrap; gap: 6px 10px; }
}

/* совсем узкие */
@media (max-width: 380px) {
  .quota-reset { display: none; }
}
</style>
</head>
<body></body>
</html>
