<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>anyhop</title>
<style>
:root {
  --bg: #0d1117; --panel: #161b22; --border: #30363d;
  --fg: #e6edf3; --dim: #8b949e;
  --green: #3fb950; --yellow: #d29922; --red: #f85149; --accent: #58a6ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: 24px;
}
.wrap { max-width: 1100px; margin: 0 auto; }
h1 { font-size: 22px; font-weight: 600; }
h1 .dot { color: var(--accent); }
.sub { color: var(--dim); font-size: 13px; margin-top: 2px; }
header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
.provider {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; margin-bottom: 16px; overflow: hidden;
}
.provider-head {
  display: flex; gap: 10px; align-items: center;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.provider-head b { font-size: 15px; }
.badge {
  font-size: 11px; padding: 2px 8px; border-radius: 10px;
  background: #21262d; color: var(--dim); border: 1px solid var(--border);
}
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 16px; font-size: 13px; }
th { color: var(--dim); font-weight: 500; border-bottom: 1px solid var(--border); }
tr + tr td { border-top: 1px solid #21262d; }
td.mono { font-family: ui-monospace, "SF Mono", monospace; }
.chip {
  display: inline-block; font-size: 11px; font-weight: 600;
  padding: 2px 10px; border-radius: 10px;
}
.chip-active   { color: var(--green);  background: rgba(63,185,80,.12); }
.chip-cooldown { color: var(--yellow); background: rgba(210,153,34,.12); }
.chip-dead     { color: var(--red);    background: rgba(248,81,73,.12); }
h2 { font-size: 15px; margin: 24px 0 10px; color: var(--dim); font-weight: 600; }
.events {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 16px; min-height: 60px;
  font-family: ui-monospace, "SF Mono", monospace; font-size: 12.5px;
  max-height: 320px; overflow-y: auto;
}
.ev { padding: 4px 0; border-bottom: 1px solid #21262d; }
.ev:last-child { border-bottom: none; }
.ev-ts { color: var(--dim); margin-right: 8px; }
.ev-rate_limited { color: var(--yellow); }
.ev-dead { color: var(--red); }
.ev-backoff, .ev-drain { color: var(--dim); }
.empty { color: var(--dim); padding: 12px 0; }
.btn {
  background: #21262d; color: var(--fg); border: 1px solid var(--border);
  border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer;
}
.btn:hover { border-color: var(--dim); }
.btn-danger { color: var(--red); }
.input {
  background: #0d1117; color: var(--fg); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 10px; font-size: 12.5px;
  font-family: ui-monospace, monospace; flex: 1;
}
.input:focus { outline: none; border-color: var(--accent); }
.addkey { display: flex; gap: 8px; }
.quota-bar {
  display: inline-block; width: 120px; height: 8px; vertical-align: middle;
  background: #21262d; border-radius: 4px; overflow: hidden;
}
.quota-fill { height: 100%; background: var(--green); border-radius: 4px; }
.quota-fill.low { background: var(--red); }
.quota-pct { margin-left: 8px; font-size: 12px; color: var(--dim); }
.loading { color: var(--dim); padding: 40px; text-align: center; }
</style>
</head>
<body></body>
</html>
