[package]
name = "anyhop-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
sycamore = "0.9"
gloo-net = { version = "0.6", features = ["http", "eventsource"] }
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures = "0.3"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3.106", features = ["Window", "Document", "Element", "Storage", "console", "Location", "EventTarget", "Event"] }

[profile.release]
opt-level = "z"
lto = true
