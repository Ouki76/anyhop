name: docker

# Builds the image described by ./Dockerfile and publishes it to GHCR.
#
#   docker pull ghcr.io/ouki76/anyhop:latest
#
# Published on every push to the default branch and on `v*` tags. Pull requests
# build the image and boot it (without pushing), so a broken Dockerfile fails
# review instead of the release. Multi-arch: see the note at the bottom.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR paths must be lowercase; <owner>/<repo> is not.
      - name: Image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # A PR from a fork gets a read-only token: only log in when we may push.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            # default branch -> latest
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            # v1.2.3 -> 1.2.3 and 1.2
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # every build gets a commit-addressed tag, so a server can pin one image
            type=sha,prefix=sha-,format=short
            # a stable name for the local smoke test below (PRs only)
            type=raw,value=smoke,enable=${{ github.event_name == 'pull_request' }}
          labels: |
            org.opencontainers.image.title=anyhop
            org.opencontainers.image.description=OpenAI-compatible LLM gateway with account and API-key rotation
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # On a PR the image is loaded into the daemon instead of pushed, so the
          # smoke test below can run it.
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # A Dockerfile that builds but cannot run is the classic release-day surprise:
      # boot the image with a minimal config and require /healthz.
      - name: Smoke-test the image (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          cfg=$(mktemp)
          cat > "$cfg" <<'TOML'
          [server]
          listen = "0.0.0.0:8080"
          api_key = "smoke-test-key"
          state_file = "/data/anyhop.redb"

          [tuning]
          models_refresh_secs = 0

          [[providers]]
          name = "smoke"
          type = "openai_compat"
          base_url = "http://127.0.0.1:9/v1"
          strategy = "fill_first"
          keys = ["sk-smoke"]
          models = ["smoke-model"]
          TOML
          image="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:smoke"
          docker rm -f anyhop-smoke >/dev/null 2>&1 || true
          docker run -d --name anyhop-smoke -p 8080:8080 \
            -v "$cfg:/etc/anyhop/anyhop.toml:ro" "$image"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "OK: the image boots and answers /healthz"
              curl -fsS -H "Authorization: Bearer smoke-test-key" \
                http://127.0.0.1:8080/v1/models >/dev/null
              echo "OK: /v1/models answers with the gateway key"
              docker rm -f anyhop-smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "FAIL: the image did not answer /healthz within 30s" >&2
          docker logs anyhop-smoke || true
          docker rm -f anyhop-smoke >/dev/null
          exit 1

# arm64 (Raspberry Pi, Ampere, Apple-silicon servers): add
#   - uses: docker/setup-qemu-action@v3
# before Buildx and `linux/arm64` to `platforms:`. It works, but the Rust +
# jemalloc build runs emulated at roughly 40 min per build, which is why it is not
# on by default.