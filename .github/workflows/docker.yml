name: docker

# Builds the image described by ./Dockerfile and publishes it to GHCR as a
# multi-arch manifest (linux/amd64 + linux/arm64):
#
#   docker pull ghcr.io/ouki76/anyhop:latest     # resolves to the host's arch
#
# Both architectures are built on *native* runners (GitHub's arm64 hosted runner).
# The alternative — one QEMU job — works but compiles Rust and jemalloc under
# emulation at roughly 40 minutes per build; native arm is a normal 5-8 minutes.
#
#   push to the default branch -> latest + sha-<short>
#   tag v1.2.3                 -> 1.2.3, 1.2, sha-<short>
#   pull request               -> amd64 only, built and booted, never pushed
#
# If the arm64 runner label is unavailable here, drop that matrix entry: the merge
# job then publishes a single-arch image without further changes.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # One place that decides the image name (GHCR paths must be lowercase) and the
  # tags, so both arch builds and the merge agree on them.
  meta:
    runs-on: ubuntu-latest
    # A hung build otherwise occupies a runner for the full default.
    timeout-minutes: 60
    outputs:
      image: ${{ steps.image.outputs.name }}
      tags: ${{ steps.tags.outputs.list }}
    steps:
      - name: Image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Tag list
        id: tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}
        run: |
          set -eu
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          short="${GITHUB_SHA::7}"
          tags="$image:sha-$short"
          if [ "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            tags="$tags,$image:latest"
          fi
          case "$GITHUB_REF" in
            refs/tags/v*)
              v="${GITHUB_REF#refs/tags/v}"
              tags="$tags,$image:$v"
              case "$v" in
                *.*.*) tags="$tags,$image:${v%.*}" ;;
              esac
              ;;
          esac
          echo "list=$tags" >> "$GITHUB_OUTPUT"
          echo "tags: $tags"

  # Pull requests: one architecture, loaded into the daemon and booted. A
  # Dockerfile that builds but cannot run is the classic release-day surprise.
  pr-image:
    needs: meta
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A hung build otherwise occupies a runner for the full default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (v4)
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0 (v3)

      - name: Build (amd64, local)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2 (v6)
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ needs.meta.outputs.image }}:smoke
          cache-from: type=gha,scope=amd64
          provenance: false

      - name: Boot the image and check it
        run: |
          set -eu
          cfg=$(mktemp)
          cat > "$cfg" <<'TOML'
          [server]
          listen = "0.0.0.0:8080"
          api_key = "smoke-test-key"
          state_file = "/data/anyhop.redb"

          [tuning]
          models_refresh_secs = 0

          [[providers]]
          name = "smoke"
          type = "openai_compat"
          base_url = "http://127.0.0.1:9/v1"
          strategy = "fill_first"
          keys = ["sk-smoke"]
          models = ["smoke-model"]
          TOML
          image="${{ needs.meta.outputs.image }}:smoke"
          docker rm -f anyhop-smoke >/dev/null 2>&1 || true
          docker run -d --name anyhop-smoke -p 8080:8080 \
            -v "$cfg:/etc/anyhop/anyhop.toml:ro" "$image"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "OK: the image boots and answers /healthz"
              curl -fsS -H "Authorization: Bearer smoke-test-key" \
                http://127.0.0.1:8080/v1/models >/dev/null
              echo "OK: /v1/models answers with the gateway key"
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/dashboard)
              test "$code" = 200
              echo "OK: the dashboard is embedded"
              docker rm -f anyhop-smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "FAIL: the image did not answer /healthz within 30s" >&2
          docker logs anyhop-smoke || true
          docker rm -f anyhop-smoke >/dev/null
          exit 1

  # One native runner per architecture; each pushes a single-arch image *by digest*
  # (no tag yet) and hands the digest to the merge job.
  build:
    needs: meta
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            # GitHub's native arm64 hosted runner (public repositories).
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # A hung build otherwise occupies a runner for the full default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (v4)
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0 (v3)

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0 (v3)
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2 (v6)
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ needs.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=anyhop
            org.opencontainers.image.description=OpenAI-compatible LLM gateway with account and API-key rotation
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false

      - name: Record the digest
        run: |
          set -eu
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "${{ matrix.arch }} -> $digest"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (v4)
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Join the per-arch digests into one manifest per tag, so `docker pull` on either
  # architecture resolves to a native image.
  merge:
    needs: [meta, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # A hung build otherwise occupies a runner for the full default.
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 (v4)
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0 (v3)

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0 (v3)
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.meta.outputs.image }}
          TAGS: ${{ needs.meta.outputs.tags }}
        run: |
          set -eu
          refs=""
          for f in /tmp/digests/*; do
            [ -f "$f" ] || continue
            refs="$refs $IMAGE@sha256:$(basename "$f")"
          done
          echo "arch digests:$refs"
          args=""
          old_ifs="$IFS"
          IFS=','
          for t in $TAGS; do
            args="$args -t $t"
          done
          IFS="$old_ifs"
          # shellcheck disable=SC2086
          docker buildx imagetools create $args $refs

      - name: Verify the published manifest
        env:
          TAGS: ${{ needs.meta.outputs.tags }}
        run: |
          set -eu
          first="${TAGS%%,*}"
          docker buildx imagetools inspect "$first" | sed -n '1,40p'

# Local arm64 builds without the hosted runner:
#   docker buildx create --use --name arm --driver docker-container
#   docker buildx build --platform linux/arm64 -t anyhop:arm64 . --load
# Works on an amd64 host through QEMU, at roughly 40 minutes for a cold build.