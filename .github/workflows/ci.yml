name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# `contents: write` is only so the integration job can publish its failure log to a
# throwaway branch (otherwise a failed e2e run is unreadable without a token).
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast gate: it must compile and the unit tests must pass before anything else runs.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Style is a gate, not a suggestion: an unformatted or un-linted tree fails CI.
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked --all-targets
      - name: Unit tests
        run: cargo test --locked 2>&1 | tee /tmp/suite.log

      - name: Publish failure logs
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_NAME: unit-tests
        run: |
          set -u
          bash .github/scripts/publish-ci-logs.sh
      # Benches are code too: keep them compiling so the numbers in the README stay real.
      - name: Build benchmarks
        run: cargo build --locked --benches
      # The no-dashboard build must keep compiling: it is the "minimal image" path
      # and is easy to break by referencing a dashboard-only symbol.
      - name: Build without the dashboard feature
        run: cargo build --locked --no-default-features

  # End-to-end: real HTTP against mock providers, including access control and the UI.
  integration:
    runs-on: ubuntu-latest
    needs: [test, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Without this the embedded dashboard is the "ui not built" placeholder and
      # the CSP assertions cannot pass (see the ui job).
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - name: Build release binary
        run: cargo build --release --locked
      # run_all.sh skips the CDP/browser part when chromium is absent; the API
      # assertions still run, which is what this job is for.
      - name: Integration suite
        env:
          # A shared 4-vCPU runner cannot hold a workstation's latency ceiling;
          # the gate is about regressions, not about the runner's jitter.
          ANYHOP_SOAK_WORKERS: "4"
          ANYHOP_SOAK_MAX_P99: "1500"
          ANYHOP_SOAK_SECS: "5"
        run: |
          set -o pipefail
          ./test/run_all.sh ./target/release/anyhop 2>&1 | tee /tmp/suite.log

      # A failing e2e run is unreadable without a token (the log endpoint needs
      # auth), and it is almost always environmental. Publish the tail to a
      # throwaway branch so the failure can be inspected from a checkout.
      - name: Publish failure logs
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          mkdir -p ci-logs
          {
            echo "# integration failure — $(date -u +%FT%TZ) — ${GITHUB_SHA}"
            echo
            echo '## suite tail'
            echo '```'
            tail -120 /tmp/suite.log 2>/dev/null || echo '(no suite log)'
            echo '```'
            echo '## failing checks'
            echo '```'
            grep -E '^  FAIL|^!!! ' /tmp/suite.log 2>/dev/null || echo '(none matched)'
            echo '```'
            echo '## gateway log tail'
            echo '```'
            tail -60 /tmp/anyhop-regress.log 2>/dev/null || echo '(no gateway log)'
            echo '```'
          } > ci-logs/last-failure.md
          cd ci-logs
          git init -q -b ci-logs .
          git add last-failure.md
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "ci: integration failure for ${GITHUB_SHA}"
          git push -q --force \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              HEAD:ci-logs
          echo "published to the ci-logs branch"

  # The dashboard is a Rust→WASM app and is not covered by `cargo build` at the root.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui
      - uses: taiki-e/install-action@trunk
      - name: Build dashboard (WASM)
        run: cd ui && trunk build --release
      # The CSP allows the inline scripts by hash; a build that changes them must
      # still produce a working app. Fail the job if the bundle is missing.
      - name: Check bundle
        run: test -s ui/dist/index.html && test -n "$(ls ui/dist/*_bg.wasm)"
      # `ui/dist` is git-ignored, so an integration checkout has no dashboard and
      # `build.rs` embeds its placeholder — that is exactly how the e2e job failed:
      # the binary served "ui not built", so there were no inline scripts and no
      # CSP hashes. Hand the real bundle to the job that builds the tested binary.
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1
