[package]
name = "anyhop"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
    "socks",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bytes = "1"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
anyhow = "1"
redb = "2"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mimalloc = "0.1"
arc-swap = "1.9.2"
base64 = "0.23.1"
rust-embed = { version = "8.13.0", optional = true }
mime_guess = { version = "2.0.5", optional = true }
memchr = "2.8.3"

[features]
default = ["dashboard"]
dashboard = ["dep:rust-embed", "dep:mime_guess"]
rust-embed = ["dep:rust-embed"]
mime_guess = ["dep:mime_guess"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
