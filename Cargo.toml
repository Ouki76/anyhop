[package]
name = "anyhop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
# In-process TLS ([server] tls_cert / tls_key). Both are already in Cargo.lock
# transitively via reqwest's rustls backend, so this adds no new crates.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
axum = "0.8"
# WebSocket upgrade for GET /v1/realtime: axum is built without its `ws` feature
# and no WS crate is available offline, so the endpoint uses hyper's raw
# upgrade hook (already in the tree through axum's server) plus a local RFC 6455
# codec in `src/ws.rs`.
hyper = { version = "1", features = ["server", "http1"] }
# Only for `TokioIo`/`TokioExecutor`: the plain-HTTP listener needs its own accept
# loop to enforce a header deadline, which `axum::serve` offers no hook for.
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
    "socks",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Surgical config edits that preserve comments/formatting (toml::Value round-trip
# would reformat the whole file).
toml_edit = "0.22"
bytes = "1"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
anyhow = "1"
redb = "2"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arc-swap = "1.9.2"
base64 = "0.23.1"
rust-embed = { version = "8.13.0", optional = true }
mime_guess = { version = "2.0.5", optional = true }
memchr = "2.8.3"
tikv-jemallocator = "0.7.0"
mimalloc = { version = "0.1", optional = true }

[features]
default = ["dashboard"]
alloc-mimalloc = ["dep:mimalloc"]
dashboard = ["dep:rust-embed", "dep:mime_guess"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
# unwind: a panicking handler only kills its own connection, not the process

[[bench]]
name = "hot_paths"
harness = false

[[bench]]
name = "load"
harness = false

[lints.rust]
# deny, not forbid: main.rs needs one `unsafe(export_name)` for jemalloc config
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
